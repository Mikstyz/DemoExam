[package]
name = "Backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }

axum = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = {
    version = "0.8",
    features = [
        "runtime-tokio",
        "postgres",
        "uuid",
        "chrono"
    ]
}

uuid = {
    version = "1",
    features = ["v4", "serde"]
}

chrono = {
    version = "0.4",
    features = ["serde"]
}

rusqlite = { version = "0.32", features = ["bundled"] }

config = "0.15"
log = "0.4"
toml = "0.8"

anyhow = "1"
